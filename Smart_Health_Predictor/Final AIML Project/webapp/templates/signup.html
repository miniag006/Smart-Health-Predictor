{% extends 'base.html' %}
{% block content %}
<section class="auth-card glass">
  <h2>Create Account</h2>
  <p class="subtitle">Join HealthAI</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="POST" id="signupForm">
    <div class="grid-2">
      <div class="field"><label>Full Name</label><input name="full_name" required></div>
      <div class="field"><label>Username</label><input name="username" required></div>
      <div class="field"><label>Password</label><input type="password" name="password" required minlength="6"></div>
      <div class="field"><label>Age</label><input type="number" name="age" min="1" max="120" required></div>
      <div class="field"><label>Gender</label>
        <select name="gender" required>
          <option value="">Select</option>
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>
      </div>
      <div class="field"><label>Weight (kg)</label><input type="number" step="0.1" name="weight" required></div>
      <div class="field"><label>Height (cm)</label><input type="number" step="0.1" name="height" required></div>
      <div class="field"><label>Email</label><input type="email" name="email" required></div>
    </div>
    <button class="btn primary full">Sign Up</button>
    <p class="switch">Have an account? <a href="{{ url_for('login') }}">Login</a></p>
  </form>
</section>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
