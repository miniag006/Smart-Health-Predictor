{% extends 'base.html' %}
{% block content %}
<section class="dashboard">
  <aside class="sidebar glass">
    <a class="profile" href="{{ url_for('profile') }}" style="text-decoration:none;color:inherit">
      <div class="avatar">{{ (full_name or 'U')[0] }}</div>
      <div>
        <h3>{{ full_name }}</h3>
        <p class="muted">Welcome back</p>
      </div>
    </a>
    <nav class="side-links">
      <a href="{{ url_for('home') }}"><i data-lucide="layout-dashboard"></i> Dashboard</a>
      <a href="{{ url_for('dashboard') }}#predict"><i data-lucide="activity"></i> Predict Disease</a>
      <a href="{{ url_for('history') }}"><i data-lucide="history"></i> Health History</a>
      <a href="{{ url_for('logout') }}"><i data-lucide="log-out"></i> Logout</a>
    </nav>
  </aside>

  <div class="content">
    <div class="card glass">
      <h3 style="margin-top:0"><i data-lucide="id-card"></i> Account Details</h3>
      {% if info %}
      <div class="grid-2">
        <div class="field">
          <label>Full Name</label>
          <input value="{{ info.full_name }}" readonly>
        </div>
        <div class="field">
          <label>Username</label>
          <input value="{{ info.username }}" readonly>
        </div>
        <div class="field">
          <label>Email</label>
          <input value="{{ info.email }}" readonly>
        </div>
        <div class="field">
          <label>Gender</label>
          <input value="{{ info.gender|title }}" readonly>
        </div>
        <div class="field">
          <label>Age</label>
          <input value="{{ info.age }}" readonly>
        </div>
        <div class="field">
          <label>Height (cm)</label>
          <input value="{{ info.height }}" readonly>
        </div>
        <div class="field">
          <label>Weight (kg)</label>
          <input value="{{ info.weight }}" readonly>
        </div>
        <div class="field full">
          <label>Member Since</label>
          <input value="{{ info.created_at }}" readonly>
        </div>
      </div>
      {% else %}
        <p class="muted">No profile data available.</p>
      {% endif %}
    </div>
  </div>
</section>
{% endblock %}
