<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title or 'HealthAI Portal' }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <script defer src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="bg-blob"></div>
  <nav class="navbar">
    <div class="brand"><i data-lucide="stethoscope"></i> HealthAI</div>
    <div class="nav-links">
      {% if session.get('user_id') %}
      <a href="{{ url_for('home') }}">Dashboard</a>
      <a href="{{ url_for('logout') }}" class="btn btn-outline">Logout</a>
      {% else %}
      <a href="{{ url_for('login') }}" class="btn">Login</a>
      <a href="{{ url_for('signup') }}" class="btn btn-outline">Sign Up</a>
      {% endif %}
    </div>
  </nav>
  <main class="container">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
      <div class="flash">
        {% for m in messages %}<div class="flash-item">{{ m }}</div>{% endfor %}
      </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script>
    document.addEventListener('DOMContentLoaded', ()=>{ if(window.lucide){ window.lucide.createIcons(); }});
  </script>
</body>
</html>
